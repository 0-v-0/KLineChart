packages:
  - docs

allowBuilds:
  # esbuild's postinstall only self-checks its binary, so it has to be allowed
  # (vite depends on it transitively as well)
  esbuild: true
  vue-demi: true

minimumReleaseAgeExclude:
  - '@rollup/*'
  - rollup

# dts-bundle-generator relies on the TypeScript JS compiler API, which TypeScript 7
# no longer exports (it only ships a native binary). Pin its internal typescript to
# 5.9.3 to decouple it from the root dependency: type checking runs on TS 7 (fast),
# while the d.ts bundle keeps using TS 5. Note that overrides do not apply to
# peerDependencies, so the build pipeline now transpiles with rollup-plugin-esbuild
# instead of depending on the TS compiler API.
overrides:
  dts-bundle-generator>typescript: 5.9.3
